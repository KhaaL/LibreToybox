<!DOCTYPE html>
<!-- LibreToybox — Math fun · Licensed under the GNU GPL v3.0; see ../LICENSE -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Math fun</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪁</text></svg>" />
  <link rel="manifest" href="../manifest.webmanifest" />
  <meta name="theme-color" content="#5CA13A" />
  <style>
    :root {
      --bg1: #F6FBEC;
      --bg2: #E4F3CD;
      --accent: #5CA13A;
      --border: #C4DDA1;
      --text: #3B5A22;
      --shadow: #CFE6AE;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; height: 100%; }
    /* Own background on html stops the body gradient propagating into
       overscroll, where it would tile and show the wrong end of the gradient. */
    html { background: var(--bg1); }
    body {
      font-family: ui-rounded, 'Hiragino Maru Gothic ProN', Quicksand, Comfortaa, 'Arial Rounded MT Bold', 'Varela Round', Calibri, sans-serif;
      background: linear-gradient(180deg, var(--bg1), var(--bg2));
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100%;
      overflow-x: hidden;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: manipulation;
    }

    header {
      width: 100%;
      max-width: 420px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px 6px;
    }
    .header-left { display: flex; align-items: center; gap: 8px; }
    .logo { display: flex; align-items: center; }
    .top-btns { display: flex; gap: 8px; }
    .top-btn {
      position: relative;
      background: #fff;
      border: 2px solid var(--border);
      border-radius: 12px;
      padding: 6px 10px;
      font-family: inherit;
      font-size: 1.3rem;
      cursor: pointer;
      box-shadow: 0 3px 0 var(--shadow);
      transition: transform .05s;
      min-width: 48px;
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      color: inherit;
    }
    .top-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--shadow); }
    /* New Game requires a deliberate hold, not a quick tap, so an accidental
       tap can't silently wipe progress. */
    .hold-progress { position: absolute; inset: 5px; border-radius: 50%; pointer-events: none; opacity: 0; transition: opacity .1s; }
    .top-btn.holding .hold-progress { opacity: 1; }

    main { width: 100%; max-width: 420px; padding: 8px 16px 18px; display: flex; flex-direction: column; align-items: center; gap: 14px; }

    /* Portrait: one tall column, same as every other single-column game. */
    .play-layout { display: flex; flex-direction: column; align-items: center; gap: 14px; width: 100%; }
    .col-left, .col-right { display: flex; flex-direction: column; align-items: center; gap: 14px; width: 100%; }

    /* Visually hidden but available to screen readers (aria-live announcements
       still fire). Standard clip-based sr-only pattern. */
    .status { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; border: 0; }

    /* Progress pips — one per problem in a set, filled as problems are
       solved. Visual only (no numbers), design principle 1. */
    #pips { display: flex; gap: 10px; margin-top: 2px; }
    .pip {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #fff;
      border: 2px solid var(--border);
      transition: background .2s, transform .2s;
    }
    .pip.filled { background: var(--accent); border-color: var(--accent); transform: scale(1.1); }
    /* A skipped round is marked distinctly, never as if it were solved —
       still a muted fill (not the neutral empty look) so the set visibly
       progresses either way (design principle 5), just honestly. */
    .pip.skipped { background: #fff; border-color: var(--accent); border-style: dashed; transform: scale(1.05); }

    /* The equation card — op badge, the sum itself, and (when it fits cleanly)
       a row of counting dots underneath as a visual aid (design principle 1). */
    .problem-card {
      width: 100%;
      background: #fff;
      border: 3px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 4px 0 var(--shadow);
      padding: 16px 10px;
      min-height: 64px;
      text-align: center;
      transition: transform .3s ease;
    }
    .problem-card.deal { animation: pop-in .35s ease-out both; }

    /* Single flat accent badge naming the operation (+ / − / ×) — one hue
       throughout, never color-coded per operation (design principle 11: a
       game's identity is its background hue family, not extra per-element hues). */
    .op-badge {
      width: 52px; height: 52px; margin: 0 auto 8px;
      border-radius: 16px; background: var(--accent); color: #fff;
      font-size: 1.8rem; font-weight: bold; line-height: 1;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 0 var(--shadow);
    }

    .equation { font-size: 2.6rem; font-weight: bold; letter-spacing: .02em; }
    .equation .eq-q { color: var(--accent); }
    /* Help reveal — a one-shot pop so it reads as "something just appeared
       here", not just a silent text swap (design principle 10). */
    .equation .eq-q.revealed { color: var(--text); animation: pop .4s ease; }

    /* Counting cues — flat accent dots, no gradient (principle 11). Only
       rendered when the numbers are small enough to read as a group at a
       glance; renderVisuals() decides per-round whether that's the case. */
    .visuals { display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; min-height: 18px; margin-top: 10px; }
    .vgroup { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; max-width: 150px; }
    .vgrid { display: flex; flex-direction: column; gap: 4px; }
    .vrow { display: flex; gap: 4px; justify-content: center; }
    .vsym { font-size: 1.3rem; opacity: .6; }
    .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--accent); flex: 0 0 auto; }
    /* A subtraction dot that's been "taken away" — faded to an outline, never
       red (red is reserved suite-wide for the wrong-answer cue). */
    .dot.gone { background: #fff; border: 2px solid var(--border); }

    /* Help / Skip — a struggling child is never stuck on one problem
       (design principle 3). Same visual language as the rest of the suite's
       secondary buttons (flat white, darker same-hue shadow, principle 11),
       sized as tools rather than header chrome (design principle 4). */
    .assist-row { display: flex; gap: 12px; justify-content: center; margin-top: 12px; }
    .assist-btn {
      min-width: 60px; min-height: 60px; padding: 6px 16px;
      border: 2px solid var(--border); border-radius: 16px;
      background: #fff; color: var(--text); font-family: inherit; font-size: 1.5rem;
      cursor: pointer; box-shadow: 0 4px 0 var(--shadow);
      transition: transform .05s, box-shadow .05s;
      display: flex; align-items: center; justify-content: center;
    }
    .assist-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--shadow); }
    .assist-btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

    /* The answer entry screen the child types the answer into. */
    #answer-wrap { display: flex; align-items: center; justify-content: center; }
    .answer-box {
      min-width: 160px;
      min-height: 66px;
      background: #F0FBE8;
      border: 3px solid var(--border);
      border-radius: 14px;
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px 24px;
      font-size: 2.6rem;
      font-weight: bold;
      color: var(--text);
      font-variant-numeric: tabular-nums;
    }
    .answer-box.empty { color: #A9C48C; }
    .answer-box.correct { animation: pop .5s ease, correctFlash .6s ease; }
    .answer-box.wrong { animation: shake .4s ease, wrongFlash .5s ease; }

    /* Numeric keypad — chunky 64px keys (design principle 4). Digit keys read
       as a uniform calculator pad; the confirm key is accent-green and the
       backspace is a muted coral so the three roles are distinct at a glance. */
    .pad {
      display: grid;
      grid-template-columns: repeat(3, 64px);
      gap: 12px;
      justify-content: center;
    }
    .key {
      width: 64px;
      height: 64px;
      border: 2px solid var(--border);
      border-radius: 16px;
      background: #fff;
      color: var(--text);
      font-family: inherit;
      font-size: 1.8rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 4px 0 var(--shadow);
      transition: transform .05s, box-shadow .05s;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: none;
    }
    .key:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--shadow); }
    .key:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    .key.confirm { background: var(--accent); color: #fff; border-color: var(--accent); }
    .key.back { background: #FFB3A0; color: #8A3D2C; border-color: #E58C77; }

    @keyframes pop-in { 0% { transform: scale(0.4); opacity: 0; } 60% { transform: scale(1.12); opacity: 1; } 100% { transform: scale(1); } }
    @keyframes pop { 0% { transform: scale(1); } 45% { transform: scale(1.25); } 100% { transform: scale(1); } }
    @keyframes shake { 0%,100% { transform: translateX(0); } 15% { transform: translateX(-9px); } 30% { transform: translateX(9px); } 45% { transform: translateX(-7px); } 60% { transform: translateX(7px); } 75% { transform: translateX(-4px); } }
    /* The suite's shared red "wrong" cue (cf. Sudoku's .conflict); self-reverts. */
    @keyframes wrongFlash { 0%,100% { border-color: var(--border); background: #F0FBE8; } 20%,65% { border-color: #E53935; background: #FFCDD2; } }
    /* Green mirror of wrongFlash for a correct answer; self-reverts too. */
    @keyframes correctFlash { 0%,100% { border-color: var(--border); background: #F0FBE8; } 30%,70% { border-color: var(--accent); background: #DFF5CE; } }
    @keyframes fall { 0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; } 100% { transform: translateY(110vh) rotate(720deg); opacity: 0; } }
    @keyframes wiggle { 0%, 100% { transform: rotate(0) scale(1); } 25% { transform: rotate(-12deg) scale(1.25); } 55% { transform: rotate(9deg) scale(1.12); } 80% { transform: rotate(-4deg) scale(1.04); } }

    .overlay {
      position: fixed; inset: 0; display: none;
      flex-direction: column; align-items: center; justify-content: center;
      z-index: 100; text-align: center; padding: 20px;
    }
    .overlay.show { display: flex; }
    #win-overlay { background: rgba(255,255,255,0.55); justify-content: flex-end; padding-bottom: 12vh; }
    #settings-overlay, #tutorial-overlay { background: rgba(255,255,255,0.92); }

    .emoji-row { font-size: 4.5rem; display: flex; gap: 18px; margin-bottom: 22px; }
    .emoji-row button { background: none; border: none; padding: 0; font: inherit; cursor: pointer; animation: pop-in .6s ease-out both; }
    .emoji-row button:nth-child(2) { animation-delay: .15s; }
    .emoji-row button:nth-child(3) { animation-delay: .3s; }
    .emoji-row button:focus-visible { outline: 3px solid var(--text); outline-offset: 2px; border-radius: 12px; }
    .emoji-row button.wiggle { animation: wiggle .5s ease; }

    .settings-card {
      background: #fff; border: 3px solid var(--border); border-radius: 18px;
      padding: 22px 26px; box-shadow: 0 10px 28px rgba(0,0,0,0.15);
      display: flex; flex-direction: column; align-items: center; gap: 14px; min-width: 260px;
    }
    .settings-card h2 { margin: 0; font-size: 2rem; }
    .size-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 18px; max-width: 252px; }
    .size-btn {
      width: 72px; height: 72px; border: 2px solid var(--border); border-radius: 16px;
      background: #fff; font-family: inherit; font-size: 1.7rem; cursor: pointer;
      box-shadow: 0 4px 0 var(--shadow); transition: transform .05s;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 2px; color: var(--text);
    }
    .size-btn small { font-size: 0.72rem; }
    .size-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--shadow); }
    .size-btn.active { box-shadow: 0 0 0 4px var(--accent), 0 4px 0 var(--shadow); }

    .confetti { position: fixed; top: 0; left: 0; width: 10px; height: 10px; pointer-events: none; z-index: 101; animation: fall linear forwards; }

    /* Landscape (phone on its side or a tablet): the single tall column wastes
       width and, on a short landscape viewport, can push the keypad below the
       fold. Flip to two side-by-side columns instead — equation/visuals on
       the left, answer box + keypad on the right — same idiom as Calm
       Corner's Visual Timer .timer-layout row flip. No min-width gate, same
       as that precedent: any landscape orientation benefits, since height is
       what's scarce there, not width. */
    @media (orientation: landscape) {
      header { max-width: 720px; }
      main { max-width: 720px; }
      .play-layout { flex-direction: row; align-items: flex-start; justify-content: center; gap: 28px; }
      .col-left { width: auto; flex: 1 1 300px; }
      .col-right { width: auto; flex: 0 0 auto; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-left">
      <a class="top-btn" id="back-btn" href="../index.html" aria-label="Back to LibreToybox home">🏠</a>
      <div class="logo" role="img" aria-label="Math fun" title="Math fun">
        <svg viewBox="0 0 48 48" width="40" height="40" aria-hidden="true">
          <rect x="6" y="8" width="36" height="32" rx="5" fill="none" stroke="#5CA13A" stroke-width="3"/>
          <line x1="6" y1="19" x2="42" y2="19" stroke="#5CA13A" stroke-width="2.5"/>
          <line x1="6" y1="29" x2="42" y2="29" stroke="#5CA13A" stroke-width="2.5"/>
          <circle cx="16" cy="19" r="3.4" fill="#F9C784" stroke="#5CA13A" stroke-width="1.5"/>
          <circle cx="26" cy="19" r="3.4" fill="#F9C784" stroke="#5CA13A" stroke-width="1.5"/>
          <circle cx="18" cy="29" r="3.4" fill="#F9C784" stroke="#5CA13A" stroke-width="1.5"/>
          <circle cx="30" cy="29" r="3.4" fill="#F9C784" stroke="#5CA13A" stroke-width="1.5"/>
        </svg>
      </div>
    </div>
    <div class="top-btns">
      <button class="top-btn" id="new-game" aria-label="New Game">🔄<span class="hold-progress" aria-hidden="true"></span></button>
      <button class="top-btn" id="settings-btn" aria-label="Settings">⚙️</button>
      <button class="top-btn" id="tutorial-btn" aria-label="How to Play">❓</button>
    </div>
  </header>

  <main>
    <div class="status" id="status" aria-live="polite"></div>
    <div class="play-layout" id="play-layout">
      <div class="col-left">
        <div id="pips" role="img" aria-label="Progress"></div>
        <div class="problem-card" id="problem-card">
          <div class="op-badge" id="op-badge" aria-hidden="true">+</div>
          <div class="equation" id="equation"></div>
          <div class="visuals" id="visuals" aria-hidden="true"></div>
          <div class="assist-row">
            <button type="button" class="assist-btn" id="help-btn" aria-label="Show the answer">💡</button>
            <button type="button" class="assist-btn" id="skip-btn" aria-label="Skip this one">⏭️</button>
          </div>
        </div>
      </div>
      <div class="col-right">
        <div id="answer-wrap">
          <div class="answer-box empty" id="answer-box"></div>
        </div>
        <div class="pad" id="pad" role="group" aria-label="Number pad"></div>
      </div>
    </div>
  </main>

  <div class="overlay" id="win-overlay" role="dialog" aria-modal="true" aria-label="You won">
    <div class="emoji-row" id="emoji-row"></div>
    <div class="top-btns">
      <a class="top-btn" id="win-home-btn" href="../index.html" aria-label="Back to LibreToybox home">🏠</a>
      <button class="top-btn" id="play-again" aria-label="Play Again">🔄</button>
    </div>
  </div>

  <div class="overlay" id="settings-overlay" role="dialog" aria-modal="true" aria-label="Settings">
    <div class="settings-card">
      <h2>⚙️</h2>
      <div class="size-row" role="radiogroup" aria-label="Difficulty">
        <button class="size-btn" data-size="easy"   role="radio" aria-label="Easy, addition only">🐣<small>+</small></button>
        <button class="size-btn" data-size="medium" role="radio" aria-label="Normal, addition and subtraction">🕊️<small>+ −</small></button>
        <button class="size-btn" data-size="hard"   role="radio" aria-label="Hard, addition, subtraction, and multiplication">🦅<small>+ − ×</small></button>
      </div>
      <button class="top-btn" id="close-settings" aria-label="Close">✕</button>
    </div>
  </div>

  <div class="overlay" id="tutorial-overlay" role="dialog" aria-modal="true" aria-label="How to Play">
    <div class="settings-card">
      <h2>🎓</h2>
      <p>Tutorial coming soon!</p>
      <button class="top-btn" id="close-tutorial" aria-label="Close">✕</button>
    </div>
  </div>

<script>
const CONFIG = {
  roundsPerSet: 5,
  advanceMs: 900,   // pause after a correct answer before the next problem (gameId-guarded)
  wrongHoldMs: 500, // input lock while the reject shake/flash plays (matches wrongFlash's duration)
  // Extra math dimensions fold INTO the three tiers rather than becoming their
  // own toggle (design principle 9), same shape as Grocery Cashier's
  // {couponRng, change} bundle: Easy is addition only, Normal adds
  // subtraction, Hard adds multiplication too. addMax/subMax cap the SUM/
  // minuend, not each addend — ordered easy→hard so
  // celebrationTiers[indexOf(size)] picks the tier (principle 5/9).
  sizes: {
    easy:   { ops: ['add'],                 addMax: 10 },
    medium: { ops: ['add', 'sub'],          addMax: 20, subMax: 20 },
    hard:   { ops: ['add', 'sub', 'mul'],   addMax: 20, subMax: 20, mulMax: 5 }
  },
  // Celebration grows with difficulty — Easy is the unchanged baseline,
  // Normal/Hard add more confetti and extra rising notes on the same fanfare.
  celebrationTiers: [
    { confetti: 60,  notes: [523.25, 659.25, 783.99] },
    { confetti: 90,  notes: [523.25, 659.25, 783.99, 1046.50] },
    { confetti: 130, notes: [523.25, 659.25, 783.99, 1046.50, 1318.51] }
  ],
  // Canonical LibreToybox pastel palette — used for confetti (design principle 11).
  palette: ['#F7A6B9','#F9C784','#FFE66D','#A8E6CF','#8ED3F4','#C3B4F7','#FFB3A0','#C8E88A']
};

// --- Shared modal a11y helper (copied into each game — the suite ships no
// bundler). Moves focus into an opened overlay, traps Tab within it, closes on
// Escape, and restores focus to the opener on close (design principle 8). ---
const Modal = {
  opener: null, overlay: null, onDismiss: null, handler: null,
  focusable(el) {
    return [...el.querySelectorAll('a[href], button:not([disabled]), input, select, textarea, [tabindex]:not([tabindex="-1"])')]
      .filter(n => n.getClientRects().length > 0);
  },
  open(overlay, onDismiss) {
    this.opener = document.activeElement;
    this.overlay = overlay;
    this.onDismiss = onDismiss || null;
    const items = this.focusable(overlay);
    (items[0] || overlay).focus({ preventScroll: true });
    this.handler = (e) => {
      if (e.key === 'Escape') {
        e.preventDefault();
        if (this.onDismiss) this.onDismiss(); else this.close();
      } else if (e.key === 'Tab') {
        const f = this.focusable(overlay);
        if (!f.length) { e.preventDefault(); return; }
        const first = f[0], last = f[f.length - 1];
        if (e.shiftKey && (document.activeElement === first || !overlay.contains(document.activeElement))) {
          e.preventDefault(); last.focus();
        } else if (!e.shiftKey && (document.activeElement === last || !overlay.contains(document.activeElement))) {
          e.preventDefault(); first.focus();
        }
      }
    };
    document.addEventListener('keydown', this.handler, true);
  },
  close() {
    if (this.handler) document.removeEventListener('keydown', this.handler, true);
    this.handler = null;
    const opener = this.opener;
    this.opener = this.overlay = this.onDismiss = null;
    if (opener && opener.focus) opener.focus({ preventScroll: true });
  }
};

const App = {
  size: 'easy',        // arithmetic is the most demanding mechanic in the suite, so Easy is the default (cf. Grocery Cashier)
  problem: null,       // { a, b, answer, symbol }
  expected: 0,
  entry: '',           // digits typed into the answer box
  progress: [],        // 'correct' | 'skipped' per concluded round this set, in order — drives #pips
  resolving: false,    // true during the pause between a concluded round and the next problem
  rejecting: false,    // true while the wrong-entry shake/flash plays — blocks input
  won: false,
  gameId: 0,
  audioCtx: null,

  emojiSets: [
    ['🎉', '🌟', '🏆'],
    ['🎈', '🌈', '🎊'],
    ['🥳', '✨', '🍭']
  ],

  init() {
    this.cacheDOM();
    this.buildPad();
    this.bindEvents();
    this.updateSizeButtons();
    this.newGame();
    this.setupPWA();
  },

  cacheDOM() {
    this.pipsEl = document.getElementById('pips');
    this.problemCard = document.getElementById('problem-card');
    this.opBadge = document.getElementById('op-badge');
    this.equationEl = document.getElementById('equation');
    this.visualsEl = document.getElementById('visuals');
    this.helpBtn = document.getElementById('help-btn');
    this.skipBtn = document.getElementById('skip-btn');
    this.answerBox = document.getElementById('answer-box');
    this.pad = document.getElementById('pad');
    this.status = document.getElementById('status');
    this.winOverlay = document.getElementById('win-overlay');
    this.newGameBtn = document.getElementById('new-game');
    this.playAgainBtn = document.getElementById('play-again');
    this.settingsOverlay = document.getElementById('settings-overlay');
    this.settingsBtn = document.getElementById('settings-btn');
    this.closeSettingsBtn = document.getElementById('close-settings');
    this.tutorialOverlay = document.getElementById('tutorial-overlay');
    this.tutorialBtn = document.getElementById('tutorial-btn');
    this.closeTutorialBtn = document.getElementById('close-tutorial');
  },

  buildPad() {
    const keys = ['1','2','3','4','5','6','7','8','9','back','0','ok'];
    this.pad.innerHTML = '';
    keys.forEach(k => {
      const b = document.createElement('button');
      b.dataset.key = k;
      if (k === 'back') { b.className = 'key back'; b.textContent = '⌫'; b.setAttribute('aria-label', 'Delete'); }
      else if (k === 'ok') { b.className = 'key confirm'; b.textContent = '✓'; b.setAttribute('aria-label', 'Check my answer'); }
      else { b.className = 'key'; b.textContent = k; b.setAttribute('aria-label', 'Number ' + k); }
      this.pad.appendChild(b);
    });
  },

  bindEvents() {
    this.bindNewGameHold();
    this.helpBtn.addEventListener('click', () => this.useHelp());
    this.skipBtn.addEventListener('click', () => this.skipProblem());
    this.playAgainBtn.addEventListener('click', () => this.newGame(true));
    this.settingsBtn.addEventListener('click', () => this.openSettings());
    this.closeSettingsBtn.addEventListener('click', () => this.closeSettings());
    this.settingsOverlay.addEventListener('click', (e) => {
      if (e.target === this.settingsOverlay) this.closeSettings();
    });
    this.tutorialBtn.addEventListener('click', () => this.openTutorial());
    this.closeTutorialBtn.addEventListener('click', () => this.closeTutorial());
    this.tutorialOverlay.addEventListener('click', (e) => {
      if (e.target === this.tutorialOverlay) this.closeTutorial();
    });
    this.settingsOverlay.querySelectorAll('.size-btn').forEach(btn => {
      btn.addEventListener('click', () => this.setSize(btn.dataset.size));
    });
    // One delegated handler covers mouse, touch and pen; real <button> keys also
    // fire click on Enter/Space, so keyboard users on a focused key work too.
    this.pad.addEventListener('click', (e) => {
      const key = e.target.closest('.key');
      if (key) this.onKey(key.dataset.key);
    });
    // Physical-keyboard parity (design principle 8): digits, Backspace, Enter.
    document.addEventListener('keydown', (e) => {
      if (this.settingsOverlay.classList.contains('show')) return;   // Modal owns keys while settings is open
      const k = e.key;
      if (k >= '0' && k <= '9') { this.onKey(k); }
      else if (k === 'Backspace') { e.preventDefault(); this.onKey('back'); }
      else if (k === 'Enter') {
        // Let a focused button (New Game, a keypad key, size, close) handle its
        // own Enter so we don't double-fire; a bare Enter elsewhere checks the answer.
        if (document.activeElement && document.activeElement.tagName === 'BUTTON') return;
        this.onKey('ok');
      }
    });
  },

  // New Game requires a deliberate hold, not a quick tap, so an accidental
  // tap can't silently wipe progress. A quick tap/keypress does nothing;
  // only a sustained HOLD_MS hold starts a fresh set.
  bindNewGameHold() {
    const HOLD_MS = 500;
    const btn = this.newGameBtn;
    const ring = btn.querySelector('.hold-progress');
    let timer = null, raf = null, startTime = null, startPt = null, active = false;

    const tick = () => {
      const pct = Math.min(100, ((performance.now() - startTime) / HOLD_MS) * 100);
      ring.style.background = `conic-gradient(rgba(92,161,58,0.85) ${pct}%, transparent ${pct}%)`;
      if (pct < 100) raf = requestAnimationFrame(tick);
    };
    const start = () => {
      if (active) return;
      active = true;
      startTime = performance.now();
      btn.classList.add('holding');
      tick();
      timer = setTimeout(() => {
        active = false;
        btn.classList.remove('holding');
        if (navigator.vibrate) navigator.vibrate(40);
        this.newGame(true);
      }, HOLD_MS);
    };
    const cancel = () => {
      if (!active) return;
      active = false;
      clearTimeout(timer);
      if (raf) cancelAnimationFrame(raf);
      btn.classList.remove('holding');
      ring.style.background = '';
    };

    btn.addEventListener('pointerdown', (e) => { startPt = { x: e.clientX, y: e.clientY }; start(); });
    btn.addEventListener('pointermove', (e) => {
      if (!active || !startPt) return;
      if (Math.hypot(e.clientX - startPt.x, e.clientY - startPt.y) > 10) cancel();
    });
    btn.addEventListener('pointerup', cancel);
    btn.addEventListener('pointercancel', cancel);
    btn.addEventListener('pointerleave', cancel);
    btn.addEventListener('keydown', (e) => {
      if ((e.key === 'Enter' || e.key === ' ') && !e.repeat) { e.preventDefault(); start(); }
    });
    btn.addEventListener('keyup', (e) => {
      if (e.key === 'Enter' || e.key === ' ') cancel();
    });
  },

  randInt(min, max) { return min + Math.floor(Math.random() * (max - min + 1)); },

  // Build one problem. Self-verifying by construction: whichever operation is
  // drawn, the operands are generated so exactly one non-negative answer
  // exists — subtraction never goes below zero, and both addends/factors stay
  // inside the tier's caps.
  generateRound() {
    const cfg = CONFIG.sizes[this.size];
    const op = cfg.ops[Math.floor(Math.random() * cfg.ops.length)];
    let a, b, answer, symbol;

    if (op === 'add') {
      a = this.randInt(0, cfg.addMax);
      b = this.randInt(0, cfg.addMax - a);
      answer = a + b; symbol = '+';
    } else if (op === 'sub') {
      a = this.randInt(1, cfg.subMax);
      b = this.randInt(0, a);          // never negative — may land on 0
      answer = a - b; symbol = '−';
    } else {
      a = this.randInt(1, cfg.mulMax);
      b = this.randInt(1, cfg.mulMax);
      answer = a * b; symbol = '×';
    }

    this.problem = { a, b, answer, symbol };
    this.expected = answer;
  },

  newGame(animated) {
    this.gameId++;
    this.won = false;
    this.progress = [];
    this.resolving = false;
    this.rejecting = false;
    this.entry = '';
    this.winOverlay.classList.remove('show');
    Modal.close();
    if (animated) this.audioSwoosh();
    this.renderPips();
    this.nextProblem(animated);
  },

  nextProblem(animated) {
    this.resolving = false;
    this.entry = '';
    this.generateRound();
    this.renderProblem(animated);
    this.renderAnswer();
    this.updateStatus(this.promptText());
  },

  // One pip per concluded round — filled (green) for a correct answer,
  // a distinct muted tint for a skipped one, so the set still visibly
  // progresses either way (design principle 5) without pretending a skip
  // was a solve.
  renderPips() {
    this.pipsEl.innerHTML = '';
    for (let i = 0; i < CONFIG.roundsPerSet; i++) {
      const pip = document.createElement('div');
      pip.className = 'pip' + (i < this.progress.length ? (this.progress[i] === 'skipped' ? ' skipped' : ' filled') : '');
      this.pipsEl.appendChild(pip);
    }
    this.pipsEl.setAttribute('aria-label', `${this.progress.length} of ${CONFIG.roundsPerSet} done`);
  },

  renderProblem(animated) {
    const p = this.problem;
    this.opBadge.textContent = p.symbol;
    this.equationEl.innerHTML = `${p.a} ${p.symbol} ${p.b} = <span class="eq-q">?</span>`;
    this.renderVisuals(p);
    this.problemCard.classList.remove('deal');
    if (animated) { void this.problemCard.offsetWidth; this.problemCard.classList.add('deal'); }
  },

  // 💡 Help — reveals the answer in place of the "?" so the child can read
  // it and still type it in themselves (direct manipulation is preserved;
  // help removes the recall step, not the typing/confirming one). One-shot
  // per round: a second tap is a no-op once revealed (design principle 2 —
  // no latent, repeatable action once the state has changed).
  useHelp() {
    if (this.won || this.resolving || this.rejecting) return;
    const q = this.equationEl.querySelector('.eq-q');
    if (!q || q.classList.contains('revealed')) return;
    q.textContent = this.expected;
    q.classList.add('revealed');
    this.playTone({ type: 'triangle', freq: 740, duration: 140, peakGain: 0.12 });
    this.updateStatus(`The answer is ${this.expected}. Type it in.`);
  },

  // ⏭️ Skip — a problem that's too hard for right now is never a dead end
  // (design principle 3): it counts as a concluded round (so the set still
  // reaches its party) but is marked distinctly on the pips, never counted
  // as a correct answer, and — like a wrong answer — carries no penalty.
  skipProblem() {
    if (this.won || this.resolving || this.rejecting) return;
    this.resolving = true;
    this.audioSkip();
    this.progress.push('skipped');
    this.renderPips();
    this.updateStatus('Skipping ahead to the next one.');

    const gen = this.gameId;
    setTimeout(() => {
      if (gen !== this.gameId) return;   // a new game replaced this set
      if (this.progress.length >= CONFIG.roundsPerSet) this.celebrate();
      else this.nextProblem(true);
    }, CONFIG.advanceMs);
  },

  // Small counting cues under the equation — only when the numbers are few
  // enough to read as a group at a glance (design principle 1). Skipped
  // outright once a round's numbers grow past that, rather than cramming a
  // wall of dots the child can't usefully count.
  renderVisuals(p) {
    let html = '';
    if (p.symbol === '+' && p.a <= 10 && p.b <= 10) {
      html = `<div class="vgroup">${this.dots(p.a)}</div><div class="vsym">+</div><div class="vgroup">${this.dots(p.b)}</div>`;
    } else if (p.symbol === '−' && p.a <= 12) {
      let out = '';
      for (let i = 0; i < p.a; i++) out += `<span class="dot${i >= p.a - p.b ? ' gone' : ''}"></span>`;
      html = `<div class="vgroup">${out}</div>`;
    } else if (p.symbol === '×' && p.a <= 6 && p.b <= 6) {
      let rows = '';
      for (let r = 0; r < p.a; r++) rows += `<div class="vrow">${this.dots(p.b)}</div>`;
      html = `<div class="vgrid">${rows}</div>`;
    }
    this.visualsEl.innerHTML = html;
    this.visualsEl.style.display = html ? 'flex' : 'none';
  },

  dots(n) {
    let s = '';
    for (let i = 0; i < n; i++) s += '<span class="dot"></span>';
    return s;
  },

  renderAnswer() {
    this.answerBox.textContent = this.entry || '–';
    this.answerBox.classList.toggle('empty', this.entry === '');
  },

  promptText() {
    return `${this.problem.a} ${this.problem.symbol} ${this.problem.b}. Type the answer.`;
  },

  onKey(k) {
    if (this.won || this.resolving || this.rejecting) return;
    if (k === 'ok') { this.checkEntry(); return; }
    if (k === 'back') {
      if (this.entry.length) {
        this.entry = this.entry.slice(0, -1);
        this.playTone({ freq: 300, duration: 60, peakGain: 0.07 });
        this.renderAnswer();
      }
      return;
    }
    // digit — a lone "0" is a valid answer (e.g. 5 − 5), but once entered it
    // blocks further digits so "00"/"05" can never form; otherwise no
    // leading zero and a two-digit cap (every answer in this game is ≤ 25).
    if (this.entry === '0') return;
    if (this.entry.length >= 2) return;
    if (this.entry === '' && k === '0') { this.entry = '0'; this.playTone({ freq: 520, duration: 60, peakGain: 0.1 }); this.renderAnswer(); return; }
    this.entry += k;
    this.playTone({ freq: 520, duration: 60, peakGain: 0.1 });
    this.renderAnswer();
  },

  checkEntry() {
    if (this.entry === '') return;
    if (parseInt(this.entry, 10) === this.expected) this.onCorrect();
    else this.onWrong();
  },

  onCorrect() {
    this.resolving = true;
    const box = this.answerBox;
    box.classList.remove('correct', 'wrong');
    void box.offsetWidth;
    box.classList.add('correct');
    this.audioRight();
    this.progress.push('correct');
    this.renderPips();
    this.updateStatus('Correct! Here comes the next one.');

    const gen = this.gameId;
    setTimeout(() => {
      if (gen !== this.gameId) return;   // a new game replaced this set
      if (this.progress.length >= CONFIG.roundsPerSet) this.celebrate();
      else this.nextProblem(true);
    }, CONFIG.advanceMs);
  },

  onWrong() {
    // Wrong answer = gentle "hmm" + shake + red flash + a short buzz, no
    // penalty (design principle 3) — a math mistake is expected practice,
    // not a rule violation. Input locks for the cue's duration so tap-spam
    // can't sneak an entry in, then the entry clears for a fresh try.
    this.rejecting = true;
    this.audioOops();
    if (navigator.vibrate) navigator.vibrate(60);
    const box = this.answerBox;
    box.classList.remove('wrong');
    void box.offsetWidth;
    box.classList.add('wrong');
    this.updateStatus('Not quite — try again!');

    const gen = this.gameId;
    setTimeout(() => {
      if (gen !== this.gameId) return;   // a new game replaced this set
      this.rejecting = false;
      box.classList.remove('wrong');
      this.entry = '';
      this.renderAnswer();
    }, CONFIG.wrongHoldMs);
  },

  celebrate() {
    this.won = true;
    const tier = CONFIG.celebrationTiers[Object.keys(CONFIG.sizes).indexOf(this.size)];
    this.audioWin(tier.notes);
    this.updateStatus('You made it through the whole set! Hooray!');
    this.renderWinEmojis();
    this.winOverlay.classList.add('show');
    Modal.open(this.winOverlay, () => this.newGame(true));
    for (let i = 0; i < tier.confetti; i++) {
      const conf = document.createElement('div');
      conf.className = 'confetti';
      conf.style.left = Math.random() * 100 + 'vw';
      conf.style.background = CONFIG.palette[Math.floor(Math.random() * CONFIG.palette.length)];
      conf.style.width = (6 + Math.random() * 8) + 'px';
      conf.style.height = (6 + Math.random() * 8) + 'px';
      conf.style.animationDuration = (1.5 + Math.random() * 2) + 's';
      conf.style.animationDelay = (Math.random() * 0.8) + 's';
      document.body.appendChild(conf);
      setTimeout(() => conf.remove(), 4500);
    }
  },

  renderWinEmojis() {
    const row = document.getElementById('emoji-row');
    const set = this.emojiSets[Math.floor(Math.random() * this.emojiSets.length)];
    row.innerHTML = set.map(e => `<button>${e}</button>`).join('');
    // Poking a celebration emoji wiggles it and chirps — a tiny toy.
    row.querySelectorAll('button').forEach(btn => btn.addEventListener('click', () => {
      btn.classList.remove('wiggle');
      void btn.offsetWidth;
      btn.classList.add('wiggle');
      this.audioEmoji();
    }));
  },

  openSettings() { this.settingsOverlay.classList.add('show'); this.updateSizeButtons(); Modal.open(this.settingsOverlay, () => this.closeSettings()); },
  closeSettings() { this.settingsOverlay.classList.remove('show'); Modal.close(); },

  openTutorial() { this.tutorialOverlay.classList.add('show'); Modal.open(this.tutorialOverlay, () => this.closeTutorial()); },
  closeTutorial() { this.tutorialOverlay.classList.remove('show'); Modal.close(); },

  setSize(size) {
    if (size === this.size) { this.closeSettings(); return; }
    this.size = size;
    this.updateSizeButtons();
    // Close first so the re-deal is visible, never a silent reset behind the
    // overlay (design principle 9).
    this.closeSettings();
    this.newGame(true);
  },

  updateSizeButtons() {
    this.settingsOverlay.querySelectorAll('.size-btn').forEach(btn => {
      const active = btn.dataset.size === this.size;
      btn.classList.toggle('active', active);
      btn.setAttribute('aria-checked', active ? 'true' : 'false');
    });
  },

  updateStatus(msg) { this.status.textContent = msg; },

  setupPWA() {
    // The whole toybox is one PWA: a single shared manifest
    // (../manifest.webmanifest, linked in <head>) and one root-scoped
    // service worker. Browsers reject blob:/data: worker scripts and
    // file:// has no SW support, so register only over http(s).
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
      navigator.serviceWorker.register('../sw.js').then((root) => {
        // Drop any old per-game worker from before unification so the one
        // root worker controls this page (longest scope wins).
        navigator.serviceWorker.getRegistrations().then((regs) =>
          regs.forEach((r) => {
            if (r !== root && r.scope.startsWith(root.scope) && r.scope !== root.scope) r.unregister();
          })
        );
      }).catch(() => {});
    }
  },

  ensureAudio() {
    if (!this.audioCtx) this.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (this.audioCtx.state === 'suspended') this.audioCtx.resume();
  },

  playTone({ type = 'sine', freq = 440, duration = 100, startGain = 0.0001, peakGain = 0.15 }) {
    this.ensureAudio();
    const ctx = this.audioCtx;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, ctx.currentTime);
    gain.gain.setValueAtTime(startGain, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(peakGain, ctx.currentTime + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration / 1000);
    osc.connect(gain).connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + duration / 1000 + 0.02);
  },

  // Rising two-note chime for a correct answer.
  audioRight() {
    this.playTone({ type: 'sine', freq: 660, duration: 90, peakGain: 0.16 });
    setTimeout(() => this.playTone({ type: 'sine', freq: 990, duration: 110, peakGain: 0.14 }), 90);
  },

  // Gentle "hmm", not a punitive buzz (design principle 3).
  audioOops() { this.playTone({ type: 'sine', freq: 240, duration: 160, peakGain: 0.1 }); },

  // Calm, neutral descending two-note "moving on" cue for Skip — deliberately
  // neither the rising audioRight() nor the low audioOops(), since skipping
  // is neither a success nor a mistake.
  audioSkip() {
    this.playTone({ type: 'triangle', freq: 392, duration: 100, peakGain: 0.12 });
    setTimeout(() => this.playTone({ type: 'triangle', freq: 330, duration: 130, peakGain: 0.1 }), 90);
  },

  audioEmoji() {
    const freq = [523, 587, 659, 784, 880][Math.floor(Math.random() * 5)]; // pentatonic chirp
    this.playTone({ type: 'sine', freq, duration: 140, peakGain: 0.15 });
  },

  audioSwoosh() {
    this.ensureAudio();
    const ctx = this.audioCtx;
    const bufferSize = ctx.sampleRate * 0.1;
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
    const src = ctx.createBufferSource();
    src.buffer = buffer;
    const gain = ctx.createGain();
    gain.gain.setValueAtTime(0.12, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.1);
    src.connect(gain).connect(ctx.destination);
    src.start();
  },

  audioWin(notes) {
    notes.forEach((freq, i) => {   // C-E-G major arpeggio, extended at higher difficulty
      setTimeout(() => this.playTone({ type: 'sine', freq, duration: 220, peakGain: 0.18 }), i * 180);
    });
  }
};

App.init();
</script>
</body>
</html>
